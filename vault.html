<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>標籤保險庫 · 需密語</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root{
    --paper:#f6f5f1; --card:#fff; --ink:#21242a; --soft:#5d6370; --line:#d9d6cd;
    --press:#006e9e; --press-deep:#00567c;
    --warn:#9a6b10; --warn-bg:#f8f1e0; --warn-line:#e0cb96;
    --fail:#c02c14; --fail-bg:#faeceb; --fail-line:#e8b3aa;
    --pass:#1a7f37; --pass-bg:#e9f4ec; --pass-line:#a7d5b4;
    --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--paper);color:var(--ink);line-height:1.7;
    font-family:"IBM Plex Sans TC",system-ui,"Microsoft JhengHei",sans-serif;}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:1.2rem;margin:0 0 4px}
  .sub{font-family:var(--mono);font-size:.8rem;color:var(--soft);margin:0 0 16px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:14px 16px;margin-bottom:14px;font-size:.86rem}
  .warnbox{background:var(--warn-bg);border-color:var(--warn-line);font-size:.82rem}
  .warnbox b{color:var(--warn)}
  input[type=password],input[type=text]{font-family:var(--mono);font-size:.95rem;padding:8px 11px;
    border:1px solid var(--line);border-radius:5px;background:#fdfdfb;color:var(--ink);width:min(22em,100%)}
  button{font-family:inherit;font-size:.88rem;padding:8px 15px;border:1px solid var(--line);
    border-radius:5px;background:#fdfdfb;color:var(--ink);cursor:pointer}
  button.primary{background:var(--press);border-color:var(--press);color:#fff;font-weight:600}
  button.primary:hover{background:var(--press-deep)}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .msg{margin-top:10px;font-size:.85rem}
  .msg.err{color:var(--fail)}
  .msg.ok{color:var(--pass)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  select,.filters input{font-family:inherit;font-size:.85rem;padding:6px 9px;
    border:1px solid var(--line);border-radius:5px;background:#fdfdfb;color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
  .cell img{width:100%;height:auto;image-rendering:pixelated;border:1px solid var(--line);border-radius:4px;background:#fff}
  .cell .m{font-family:var(--mono);font-weight:700;font-size:1rem;letter-spacing:.05em;margin-top:6px}
  .cell .s{font-family:var(--mono);font-size:.7rem;color:var(--soft);word-break:break-all}
  .cell a{display:block;font-size:.74rem;color:var(--press-deep);text-decoration:none;margin-top:5px}
  .cell a:hover{text-decoration:underline}
  .ph{display:flex;align-items:center;justify-content:center;height:110px;color:var(--soft);
    font-size:.76rem;border:1px dashed var(--line);border-radius:4px}
  footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);
    font-size:.78rem;color:var(--soft)}
  footer a{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">

<h1>標籤保險庫</h1>
<p class="sub">加密存放的實體標籤圖　·　需要密語才能開啟</p>

<div class="box warnbox">
  <b>這是什麼、不是什麼。</b>這裡放的是<b>可列印的實體防偽標籤圖</b>——標籤圖本身就是標籤，
  任何數位副本都帶著有效的隱碼（實測 JPEG 壓縮與縮圖都殺不掉），列印出來就驗得過。<br>
  因此它是加密存放的。這道加密擋得住搜尋引擎、爬蟲與路過的人；
  <b>擋不住拿到密語的人</b>。密語請只給需要的人，換批就換密語。
</div>

<div class="box" id="gate">
  <div class="row">
    <input type="password" id="pw" placeholder="輸入密語" autocomplete="off" spellcheck="false">
    <button id="btnOpen" class="primary">開啟</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div id="app" style="display:none">
  <div class="filters">
    <input type="text" id="q" placeholder="搜尋序號" style="width:13em">
    <select id="fm"><option value="">全部層組合</option></select>
    <span class="msg" id="count"></span>
    <button id="btnLock" style="margin-left:auto">鎖回去</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<footer>
  <a href="console.html">品牌端管理台</a>　·　<a href="index.html">消費者驗證頁</a><br>
  解密全程在你的瀏覽器裡完成，密語不會送到任何伺服器（本站是純靜態頁，沒有後端）。
</footer>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const LN = "①②③④";
const STD = {"1111":"四層全開","1100":"僅深色層","0011":"僅淺色層","0000":"無隱碼對照"};
const maskName = m => STD[m] || ([...m].filter(c=>c==="1").length + " 層（"
  + [...m].map((c,i)=>c==="1"?LN[i]:"").join("") + "）");

let KEY = null, META = null;
const cache = new Map();

const b2h = b => [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const h2b = h => new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));

/* 與 make_vault.py 對應：PBKDF2-HMAC-SHA256 → AES-256-GCM，檔案 = IV(12) ‖ 密文 ‖ tag(16) */
async function deriveKey(pw, saltHex, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
    "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:h2b(saltHex), iterations:iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function decrypt(buf){
  const b = new Uint8Array(buf);
  return crypto.subtle.decrypt({name:"AES-GCM", iv:b.slice(0,12)}, KEY, b.slice(12));
}
async function fetchDec(name){
  const r = await fetch("vault/" + name, {cache:"no-store"});
  if(!r.ok) throw new Error("讀不到 " + name + "（HTTP " + r.status + "）");
  return decrypt(await r.arrayBuffer());
}

$("btnOpen").onclick = async ()=>{
  const pw = $("pw").value;
  if(!pw){ $("msg").className="msg err"; $("msg").textContent="請先輸入密語。"; return; }
  $("btnOpen").disabled = true;
  $("msg").className="msg"; $("msg").textContent="解密中…（金鑰推導刻意跑得慢，約一兩秒）";
  try{
    const man = await fetch("vault/manifest.json", {cache:"no-store"}).then(r=>{
      if(!r.ok) throw new Error("找不到保險庫（vault/manifest.json）"); return r.json(); });
    KEY = await deriveKey(pw, man.kdf.salt, man.kdf.iter);
    META = JSON.parse(new TextDecoder().decode(await fetchDec("meta.bin")));
    $("gate").style.display="none";
    $("app").style.display="";
    initFilters();
    render();
  }catch(e){
    KEY = null;
    $("msg").className="msg err";
    // WebCrypto 解密失敗會丟 OperationError，訊息通常是空的
    const wrongPw = (e && (e.name === "OperationError" || !e.message));
    $("msg").textContent = wrongPw
      ? "密語不對。"
      : ("開不起來：" + (e.message || e.name || String(e)));
  }finally{ $("btnOpen").disabled = false; }
};
$("btnLock").onclick = ()=>{
  KEY = null; META = null; cache.forEach(u=>URL.revokeObjectURL(u)); cache.clear();
  $("pw").value=""; $("grid").innerHTML="";
  $("app").style.display="none"; $("gate").style.display="";
  $("msg").className="msg"; $("msg").textContent="已鎖回去。";
};

function initFilters(){
  const masks = [...new Set(META.map(r=>r.layers))].sort();
  $("fm").innerHTML = `<option value="">全部層組合</option>` +
    masks.map(m=>`<option value="${m}">${m}　${maskName(m)}</option>`).join("");
  $("q").oninput = render; $("fm").onchange = render;
}
function filtered(){
  const q = $("q").value.trim().toUpperCase(), m = $("fm").value;
  return META.filter(r => (!q || r.serial.includes(q)) && (!m || r.layers === m));
}
function render(){
  const rows = filtered();
  $("count").textContent = `${rows.length} / ${META.length} 張`;
  $("grid").innerHTML = rows.map(r=>{
    const vurl = r.url + (r.url.includes("?") ? "&" : "?") + "layers=" + r.layers;
    return `<div class="cell" data-id="${r.id}">
      <div class="ph" data-ph>點「載入圖」</div>
      <div class="m">${r.layers}</div>
      <div class="s">${r.serial}</div>
      <div class="s" style="color:var(--soft)">${maskName(r.layers)}</div>
      <a href="#" data-load>載入圖</a>
      <a href="${vurl}" target="_blank">開驗證頁 →</a>
    </div>`;
  }).join("");
}
$("grid").addEventListener("click", async e=>{
  const a = e.target.closest("a[data-load]");
  if(!a) return;
  e.preventDefault();
  const cell = a.closest(".cell"), id = cell.dataset.id;
  a.textContent = "解密中…";
  try{
    let url = cache.get(id);
    if(!url){
      const buf = await fetchDec(id + ".bin");
      url = URL.createObjectURL(new Blob([buf], {type:"image/png"}));
      cache.set(id, url);
    }
    const ph = cell.querySelector("[data-ph]");
    ph.outerHTML = `<img src="${url}" alt="標籤 ${id}">`;
    a.outerHTML = `<a href="${url}" target="_blank">原圖另開 →</a>`;
  }catch(err){
    a.textContent = "解密失敗";
  }
});
</script>
</body>
</html>
